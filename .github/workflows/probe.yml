name: Sondage LinkedIn (ponctuel)
on:
  push:
    branches: [probe-linkedin]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe.py
      - run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add li_results.json
          git commit -m "Résultats"
          git push
